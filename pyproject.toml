[project]
name = "oricalcum-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.136.0",
    "uvicorn[standard]>=0.49.0",
    "pydantic>=2.11.0",
    "pydantic-settings>=2.7.0",
    "PyJWT==2.10.1",
    "supabase==2.10.0",
    "python-dotenv==1.0.1",
    "sqlalchemy>=2.0",
    "psycopg2-binary",
    "alembic>=1.13",
    "cryptography>=42.0.0",
    "fastmcp>=3.4.0",
    "mcp>=1.27.0",
    "langchain>=1.3.0",
    "langchain-core>=1.4.0",
    "langchain-google-genai>=4.2.0",
    "langchain-mcp-adapters>=0.2.0",
    "langgraph>=1.2.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra"
